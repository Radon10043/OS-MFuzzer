{
    "compiler": "$COMPILER",
    "compiler_type": "$COMPILER",
    "bin_dir": "$BIN_DIR",
    "ccache": "/usr/bin/ccache",
    "kernel_repo": "$KERNEL",
    "kernel_branch": "master",
    "syzkaller_repo": "/home/go/src/github.com/Radon10043/SyzMeta-bisect/syzkaller",
    "userspace": "$IMAGE",
    "kernel_config": "$SYZMETA/syzkaller/dashboard/config/linux/upstream-apparmor-kasan.config",
    "kernel_baseline_config": "$SYZMETA/syzkaller/dashboard/config/linux/upstream-apparmor-kasan-base.config",
    "manager": {
        "name": "bisect",
        "target": "linux/amd64",
        "http": "127.0.0.1:11451",
        "workdir": "$SYZMETA/workdir/bisect",
        "kernel_obj": "$KERNEL",
        "image": "$IMAGE/bullseye.img",
        "sshkey": "$IMAGE/bullseye.id_rsa",
        "syzkaller": "/home/go/src/github.com/Radon10043/SyzMeta-bisect/syzkaller",
        "procs": 8,
        "type": "qemu",
        "kernel_src": "$KERNEL",
        "vm": {
            "count": $VMCOUNT,
            "kernel": "$KERNEL/arch/x86/boot/bzImage",
            "cpu": 2,
            "mem": 2048,
            "cmdline": "root=/dev/sda1 rw console=ttyS0 kaslr crashkernel=512M minnowboard_1:eth0::: security=none"
        }
    }
}